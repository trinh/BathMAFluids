<article class="definition definition-like"><h2 class="heading">
<span class="type">Definition</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">3.5.2</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Vorticity.</span>
</h2>
<div class="para logical">
<div class="para">The <em class="emphasis">vorticity</em>, <span class="process-math">\(\bomega\text{,}\)</span> of the velocity field <span class="process-math">\(\bu\)</span> is defined by</div>
<div class="displaymath process-math">
\begin{equation}
\bomega \equiv \nabla \times \bu.\tag{3.5.2}
\end{equation}
</div>
<div class="para">The vorticity is a measure of the local rotation of the flow.</div>
