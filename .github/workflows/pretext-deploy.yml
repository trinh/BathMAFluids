name: Build and Deploy
on:
  # Currently, this workflow only runs when manually selected (the `workflow_dispatch` event).
  # If you would like it to run on other events, uncomment some of the lines below.

  # # Runs on pull requests
  # pull_request:
  #     branches: ["*"]

  # # Runs on pushes to main
  # push:
  #     branches: ["main"]

  # # Runs every day at 00:00 UTC
  # schedule:
  #     - cron: '0 0 * * *'

  # Runs on demand
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container: oscarlevin/pretext-full

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: set up node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: add gh-cli
        run: |
          apt-get update
          apt-get install gh jq -y

      - name: setup git config
        run: |
          git config --global --add safe.directory $(pwd)
          git config user.name "${{ github.actor }} via GitHub Actions"
          git config user.email "${{ github.actor }}@github_actions.no_reply"

      - name: install deps
        run: pip install -r requirements.txt --break-system-packages

      - name: install local ptx files
        run: pretext --version

      - name: install pandoc
        run: |
          which pandoc || (apt-get update && apt-get install -y pandoc)

      - name: build deploy targets (web, print)
        run: pretext build --deploys

      - name: build latex source for docx conversion
        run: pretext build latex

      - name: build docx download with pandoc
        run: |
          mkdir -p output/doc
          pandoc output/latex/main.tex -o output/doc/main.docx --resource-path=output/latex

      - name: stage deploy targets
        run: pretext deploy --stage-only

      - name: add docx download to staged site
        run: |
          mkdir -p output/stage/doc
          cp output/doc/main.docx output/stage/doc/main.docx

      - name: commit staged site to gh-pages (no push yet)
        run: |
          python3 - <<'PYEOF'
          from pretext.project import Project
          project = Project.parse()
          project.deploy(update_source=False, skip_staging=True, no_push=True)
          PYEOF

      - name: push gh-pages branch
        run: git push origin gh-pages --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
